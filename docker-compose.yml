# Shared settings. GPU access lives in one override per vendor, picked by COMPOSE_FILE in .env:
#   AMD / Intel (Vulkan):  COMPOSE_FILE=docker-compose.yml:compose.amd.yml
#   NVIDIA (CUDA):         COMPOSE_FILE=docker-compose.yml:compose.nvidia.yml
#   AMD on Docker Desktop for Windows (ROCm):  KILN_BACKEND=rocm, COMPOSE_FILE=docker-compose.yml:compose.wsl.yml
# .env also sets COMPOSE_PATH_SEPARATOR=: so the ":" works on Windows (Compose's default there is ";").
# scripts/setup-env.sh detects the GPU and writes this for you.
services:
  kiln:
    build:
      context: .
      args:
        KILN_BACKEND: ${KILN_BACKEND:-vulkan}
        LLAMA_CPP_REF: ${LLAMA_CPP_REF:-ff0dbb975e93a9a2899efa34bdd32d1c5cfbc183}
        AUDIO_CPP_REF: ${AUDIO_CPP_REF:-0097d365a00b52a6991ad7618f0a04e8d2935e47}
        CUDA_VERSION: ${CUDA_VERSION:-12.8.1}
        CUDA_ARCHITECTURES: ${CUDA_ARCHITECTURES:-default}
        ROCM_ARCHITECTURES: ${ROCM_ARCHITECTURES:-default}
    image: kiln:${KILN_BACKEND:-vulkan}
    container_name: kiln
    restart: unless-stopped
    # Run as you, so downloads in the models folder belong to you.
    user: "${KILN_UID:-1000}:${KILN_GID:-1000}"
    ports:
      - "${KILN_BIND:-0.0.0.0}:${KILN_UI_PORT:-8090}:8090"   # control panel
      - "${KILN_BIND:-0.0.0.0}:${KILN_API_PORT:-8080}:8080"  # OpenAI-compatible API (recorded)
    environment:
      KILN_PUBLIC_UI_PORT: ${KILN_UI_PORT:-8090}
      KILN_PUBLIC_API_PORT: ${KILN_API_PORT:-8080}
      KILN_UI_PASSWORD: ${KILN_UI_PASSWORD:-}
      KILN_API_TOKEN: ${KILN_API_TOKEN:-}
      KILN_CORS_ORIGINS: ${KILN_CORS_ORIGINS:-}
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ${MODELS_DIR:-/opt/models}:/models
      - ./data:/data
    ulimits:
      memlock: -1  # lets --mlock pin model weights
    stop_grace_period: 30s
